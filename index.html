<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f172a" />
  <title>Hilton Games Official</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header { padding: 30px 20px 10px; }
    h1 { margin: 0 0 10px; font-size: clamp(2.2rem, 5vw, 3.5rem); }
    p { margin: 0; color: #cbd5e1; line-height: 1.6; }
    .hero { margin-top: 40px; padding: 0 16px; }
    .search-container { max-width: 760px; margin: 24px auto 0; }
    .search-box {
      display: flex;
      max-width: 700px;
      margin: 0 auto;
      overflow: hidden;
      background: white;
      border-radius: 999px;
      box-shadow: 0 8px 25px rgba(0,0,0,.25);
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      padding: 18px 22px;
      border: 0;
      outline: none;
      font-size: 1rem;
    }
    .search-box button {
      padding: 18px 28px;
      border: 0;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .search-box button:hover, .search-box button:focus-visible { background: #1d4ed8; }
    .search-box button:disabled { opacity: .7; cursor: wait; }
    .search-note { margin-top: 14px; font-size: .95rem; }
    .games {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 70px;
      padding: 0 16px 50px;
    }
    .card {
      width: min(220px, 100%);
      padding: 20px;
      border-radius: 14px;
      background: rgba(30,41,59,.9);
      box-shadow: 0 10px 20px rgba(0,0,0,.2);
    }
    .card h2 { margin: 0 0 8px; font-size: 1.15rem; }
    .card p { color: #cbd5e1; }
    .full-screen-results {
      position: fixed;
      z-index: 1000;
      inset: 0;
      display: none;
      padding: 16px;
      background: #0f172a;
    }
    .full-screen-results.visible { display: block; }
    .results-panel {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #f3f4f6;
      color: #111827;
      text-align: left;
    }
    .results-toolbar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 20px;
      background: #0f172a;
      color: white;
    }
    .results-toolbar h2 { margin: 0; font-size: 1.2rem; overflow-wrap: anywhere; }
    .close-results {
      flex: 0 0 auto;
      padding: 10px 16px;
      border: 0;
      border-radius: 10px;
      background: #ef4444;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }
    .results-content {
      flex: 1;
      overflow-y: auto;
      padding: clamp(18px, 5vw, 48px);
      background: #f8fafc;
    }
    .result-list { width: min(850px, 100%); margin: 0 auto; }
    .result-item { margin-bottom: 24px; text-align: left; }
    .result-item a { color: #1d4ed8; font-size: 1.2rem; font-weight: 600; text-decoration: none; }
    .result-item a:hover { text-decoration: underline; }
    .result-url { margin: 5px 0; color: #15803d; font-size: .85rem; overflow-wrap: anywhere; }
    .result-item p { color: #374151; }
    .results-message { width: min(850px, 100%); margin: 0 auto; color: #374151; }
    footer { padding: 20px 16px 30px; color: #94a3b8; font-size: .95rem; }
    @media (max-width: 480px) {
      .search-box { flex-direction: column; border-radius: 16px; }
      .search-box button { width: 100%; }
      .full-screen-results { padding: 0; }
      .results-panel { border-radius: 0; }
      .results-toolbar { padding: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Hilton Games Official</h1>
    <p>Your hub for games, tools, and entertainment</p>
  </header>
  <main>
    <section class="hero">
      <form id="searchForm" class="search-container">
        <div class="search-box">
          <input id="searchInput" type="search" maxlength="300" placeholder="Search the web..." aria-label="Search the web" required />
          <button id="searchButton" type="submit">Search</button>
        </div>
      </form>
      <p class="search-note">Search results appear here in a fullscreen view.</p>
    </section>
    <section class="games" aria-label="Site categories">
      <article class="card"><h2>Popular Games</h2><p>Play the latest games instantly.</p></article>
      <article class="card"><h2>Updates</h2><p>Stay up to date with new releases.</p></article>
      <article class="card"><h2>Community</h2><p>Connect with other players.</p></article>
    </section>
  </main>
  <div id="resultsOverlay" class="full-screen-results" role="dialog" aria-modal="true" aria-labelledby="resultsTitle" aria-hidden="true">
    <section class="results-panel">
      <div class="results-toolbar">
        <h2 id="resultsTitle">Search results</h2>
        <button id="closeResults" class="close-results" type="button">Close</button>
      </div>
      <div id="resultsContent" class="results-content" aria-live="polite"></div>
    </section>
  </div>
  <footer>© 2026 Hilton Games Official</footer>
  <script>
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const searchButton = document.getElementById("searchButton");
    const resultsOverlay = document.getElementById("resultsOverlay");
    const resultsContent = document.getElementById("resultsContent");
    const resultsTitle = document.getElementById("resultsTitle");
    const closeResults = document.getElementById("closeResults");

    function closeSearchResults() {
      resultsOverlay.classList.remove("visible");
      resultsOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
      searchInput.focus();
    }

    function showResults() {
      resultsOverlay.classList.add("visible");
      resultsOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      closeResults.focus();
    }

    function renderResults(items) {
      resultsContent.replaceChildren();
      if (!items.length) {
        const message = document.createElement("p");
        message.className = "results-message";
        message.textContent = "No results were returned. Try a different search.";
        resultsContent.append(message);
        return;
      }

      const list = document.createElement("div");
      list.className = "result-list";
      items.forEach((item) => {
        const article = document.createElement("article");
        article.className = "result-item";
        const link = document.createElement("a");
        link.href = item.url;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = item.title;
        const url = document.createElement("div");
        url.className = "result-url";
        url.textContent = item.url;
        const snippet = document.createElement("p");
        snippet.textContent = item.snippet || "";
        article.append(link, url, snippet);
        list.append(article);
      });
      resultsContent.append(list);
    }

    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;

      resultsTitle.textContent = `Results for: ${query}`;
      resultsContent.replaceChildren();
      const loading = document.createElement("p");
      loading.className = "results-message";
      loading.textContent = "Searching…";
      resultsContent.append(loading);
      showResults();
      searchButton.disabled = true;

      try {
        const response = await fetch(`/search?q=${encodeURIComponent(query)}`, {
          headers: { Accept: "application/json" }
        });
        const payload = await response.json();
        if (!response.ok) throw new Error(payload.error || "Search failed. Please try again.");
        renderResults(Array.isArray(payload.results) ? payload.results : []);
      } catch (error) {
        resultsContent.replaceChildren();
        const message = document.createElement("p");
        message.className = "results-message";
        message.textContent = error.message || "Could not load search results. Please try again.";
        resultsContent.append(message);
      } finally {
        searchButton.disabled = false;
      }
    });

    closeResults.addEventListener("click", closeSearchResults);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && resultsOverlay.classList.contains("visible")) {
        closeSearchResults();
      }
    });
  </script>
</body>
</html>
