<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilton Games Official</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 30px 20px 10px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .hero {
      margin-top: 40px;
      padding: 0 16px;
    }
    .search-container {
      max-width: 760px;
      margin: 24px auto 0;
    }
    .search-box {
      display: flex;
      background: white;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      max-width: 700px;
      margin: 0 auto;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 18px 22px;
      font-size: 1rem;
    }
    .search-box button {
      border: none;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 18px 28px;
      cursor: pointer;
    }
    .search-box button:hover,
    .search-box button:focus-visible {
      background: #1d4ed8;
    }
    .search-note {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .games {
      margin-top: 70px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 0 16px 50px;
    }
    .card {
      width: min(220px, 100%);
      background: rgba(30, 41, 59, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .card p {
      color: #cbd5e1;
    }
    footer {
      padding: 20px 16px 30px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    @media (max-width: 480px) {
      .search-box {
        border-radius: 16px;
        flex-direction: column;
      }
      .search-box button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Hilton Games Official</h1>
    <p>Your hub for games, tools, and entertainment</p>
  </header>

  <main>
    <section class="hero">
      <form class="search-container" action="https://duckduckgo.com/" method="get" target="_blank">
        <div class="search-box">
          <input type="search" name="q" placeholder="Search the web..." aria-label="Search the web" required />
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="search-note">This works on GitHub Pages without a backend proxy.</p>
    </section>

    <section class="games" aria-label="Site categories">
      <article class="card">
        <h2>Popular Games</h2>
        <p>Play the latest games instantly.</p>
      </article>
      <article class="card">
        <h2>Updates</h2>
        <p>Stay up to date with new releases.</p>
      </article>
      <article class="card">
        <h2>Community</h2>
        <p>Connect with other players.</p>
      </article>
    </section>
  </main>

  <footer>© 2026 Hilton Games Official</footer>
</body>
</html>
