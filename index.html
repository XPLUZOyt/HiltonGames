<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hilton Games Official</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    header {
      padding: 30px 20px 10px;
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(2.2rem, 5vw, 3.5rem);
    }
    p {
      margin: 0;
      color: #cbd5e1;
      line-height: 1.6;
    }
    .hero {
      margin-top: 40px;
      padding: 0 16px;
    }
    .search-container {
      max-width: 760px;
      margin: 24px auto 0;
    }
    .search-box {
      display: flex;
      background: white;
      border-radius: 999px;
      overflow: hidden;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      max-width: 700px;
      margin: 0 auto;
    }
    .search-box input {
      flex: 1;
      min-width: 0;
      border: none;
      outline: none;
      padding: 18px 22px;
      font-size: 1rem;
    }
    .search-box button {
      border: none;
      background: #2563eb;
      color: white;
      font-size: 1rem;
      font-weight: bold;
      padding: 18px 28px;
      cursor: pointer;
    }
    .search-box button:hover,
    .search-box button:focus-visible {
      background: #1d4ed8;
    }
    .search-note {
      margin-top: 14px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }
    .games {
      margin-top: 70px;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      padding: 0 16px 50px;
    }
    .card {
      width: min(220px, 100%);
      background: rgba(30, 41, 59, 0.9);
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    .card h2 {
      margin: 0 0 8px;
      font-size: 1.15rem;
    }
    .card p {
      color: #cbd5e1;
    }
    .full-screen-results {
      position: fixed;
      inset: 0;
      display: none;
      background: rgba(15, 23, 42, 0.92);
      z-index: 1000;
      padding: 20px;
    }
    .full-screen-results.visible {
      display: block;
    }
    .results-panel {
      position: relative;
      width: 100%;
      height: 100%;
      background: #f3f4f6;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .results-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      color: white;
      padding: 12px 18px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .results-toolbar h2 {
      font-size: 1.2rem;
      margin: 0;
    }
    .close-results {
      border: none;
      background: #ef4444;
      color: white;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }
    .results-iframe-wrap {
      width: 100%;
      height: calc(100% - 60px);
      background: white;
      overflow: auto;
    }
    .results-content {
      width: 100%;
      min-height: 100%;
      background: white;
      padding: 18px;
      color: #111827;
      font-family: Arial, sans-serif;
      overflow: auto;
    }
    .results-content a {
      color: #1d4ed8;
      text-decoration: none;
    }
    .results-content a:hover {
      text-decoration: underline;
    }
    footer {
      padding: 20px 16px 30px;
      color: #94a3b8;
      font-size: 0.95rem;
    }
    @media (max-width: 480px) {
      .search-box {
        border-radius: 16px;
        flex-direction: column;
      }
      .search-box button {
        width: 100%;
      }
      .results-toolbar {
        flex-direction: column;
        gap: 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Hilton Games Official</h1>
    <p>Your hub for games, tools, and entertainment</p>
  </header>

  <main>
    <section class="hero">
      <form id="searchForm" class="search-container">
        <div class="search-box">
          <input id="searchInput" type="search" placeholder="Search the web..." aria-label="Search the web" required />
          <button type="submit">Search</button>
        </div>
      </form>
      <p class="search-note">Results open full screen inside the site.</p>
    </section>

    <section class="games" aria-label="Site categories">
      <article class="card">
        <h2>Popular Games</h2>
        <p>Play the latest games instantly.</p>
      </article>
      <article class="card">
        <h2>Updates</h2>
        <p>Stay up to date with new releases.</p>
      </article>
      <article class="card">
        <h2>Community</h2>
        <p>Connect with other players.</p>
      </article>
    </section>
  </main>

  <div id="resultsOverlay" class="full-screen-results" aria-live="polite">
    <div class="results-panel">
      <div class="results-toolbar">
        <h2 id="resultsTitle">Search results</h2>
        <button id="closeResults" class="close-results" type="button">Close</button>
      </div>
      <div class="results-iframe-wrap">
        <div id="resultsContent" class="results-content"></div>
      </div>
    </div>
  </div>

  <footer>© 2026 Hilton Games Official</footer>

  <script>
    const searchForm = document.getElementById("searchForm");
    const searchInput = document.getElementById("searchInput");
    const resultsOverlay = document.getElementById("resultsOverlay");
    const resultsContent = document.getElementById("resultsContent");
    const resultsTitle = document.getElementById("resultsTitle");
    const closeResults = document.getElementById("closeResults");

    async function loadSearchResults(query) {
      resultsTitle.textContent = `Results for: ${query}`;
      resultsContent.innerHTML = "<p>Loading results...</p>";
      resultsOverlay.classList.add("visible");

      try {
        const response = await fetch(`/search?q=${encodeURIComponent(query)}`);

        if (!response.ok) {
          throw new Error("Search request failed");
        }

        const html = await response.text();
        const doc = new DOMParser().parseFromString(html, "text/html");

        const results = doc.querySelectorAll(".result, .result-link, .results .result") || [];
        const bodyContent = doc.body.innerHTML || html;

        if (results.length > 0) {
          const container = document.createElement("div");
          container.innerHTML = "";

          results.forEach((result) => {
            container.appendChild(result.cloneNode(true));
          });

          resultsContent.innerHTML = container.innerHTML;
        } else {
          resultsContent.innerHTML = bodyContent;
        }
      } catch (error) {
        resultsContent.innerHTML = `
          <div style="padding: 20px; color: #111827; font-family: Arial, sans-serif;">
            <h3>Search unavailable</h3>
            <p>The search proxy could not load the results.</p>
          </div>
        `;
      }
    }

    searchForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const query = searchInput.value.trim();
      if (!query) return;
      await loadSearchResults(query);
    });

    closeResults.addEventListener("click", () => {
      resultsOverlay.classList.remove("visible");
    });
  </script>
</body>
</html>
